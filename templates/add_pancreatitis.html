<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Оценка тяжести панкреатита по Рэнсону</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/pancreatitis_styles.css">
    <style>
        /* фото и видео: превью + подпись */
        .media-slot { display: block; padding: 0; overflow: hidden; }
        .media-slot img,
        .media-slot video {
            display: block;
            width: 100%;
            height: 150px;
            object-fit: cover;
            background-color: #eee;
        }
        .media-caption {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 12px;
            font-size: 13px;
            font-weight: 700;
        }
        .media-caption i { font-size: 16px; margin-bottom: 0; }
        .media-caption span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .media-locked { cursor: default; }
    </style>
</head>
<body>

<div class="mobile-container">

    <div id="add-page" class="page active">
        <h2 class="page-title">Новая карточка</h2>

        {{ if .Error }}
        <p class="form-error">{{ .Error }}</p>
        {{ end }}

        {{ if .Draft }}
        <form action="/pancreatitis-signs/publish" method="POST">
            <div class="form-group">
                <label class="form-label">Медиафайл (Фото/Видео)</label>
                <div class="media-upload-row">
                    <div class="upload-area media-slot media-locked">
                        <img src="{{ .ImageURL }}" alt="Фото"
                             onerror="this.onerror=null; this.src='/static/img/default_pancreatitis_sign.jpg';">
                        <div class="media-caption"><i class="fa-solid fa-image"></i><span>Фото</span></div>
                    </div>
                    <div class="upload-area media-slot media-locked">
                        <video src="{{ .VideoURL }}" controls muted playsinline preload="metadata"
                               onerror="this.onerror=null; this.src='/static/video/default_pancreatitis_sign.mp4';"></video>
                        <div class="media-caption"><i class="fa-solid fa-video"></i><span>Видео</span></div>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Тема / Критерий</label>
                <input type="text" name="title" class="form-input" value="{{ .Draft.Title }}" maxlength="100" required>
            </div>

            <div class="form-group">
                <label class="form-label">Описание критерия</label>
                <textarea name="description" class="form-textarea" maxlength="500" required>{{ .Draft.Description }}</textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Этап оценки</label>
                <input type="text" name="stage" class="form-input" value="{{ .Draft.Stage }}" placeholder="При поступлении / Через 48 часов" maxlength="30" required>
            </div>

            <div class="form-group">
                <label class="form-label">Пороговое значение</label>
                <input type="number" name="threshold_value" class="form-input" value="{{ if ne .Draft.ThresholdValue 0.0 }}{{ .Draft.ThresholdValue }}{{ end }}" step="any" required>
            </div>

            <button type="submit" class="submit-btn">Опубликовать</button>
        </form>
        {{ else }}
        <form action="/pancreatitis-signs/create" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label class="form-label">Медиафайл (Фото/Видео)</label>
                <div class="media-upload-row">
                    <label class="upload-area media-slot">
                        <img src="{{ .DefaultImageURL }}" alt="Фото">
                        <input type="file" name="image" accept="image/*" hidden>
                        <div class="media-caption"><i class="fa-solid fa-image"></i><span>Нажмите, чтобы выбрать фото</span></div>
                    </label>
                    <label class="upload-area media-slot">
                        <video src="{{ .DefaultVideoURL }}" muted playsinline preload="metadata"></video>
                        <input type="file" name="video" accept="video/*" hidden>
                        <div class="media-caption"><i class="fa-solid fa-video"></i><span>Нажмите, чтобы выбрать видео</span></div>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Тема / Критерий</label>
                <input type="text" name="title" class="form-input" maxlength="100" required>
            </div>

            <button type="submit" class="submit-btn">Далее</button>
        </form>
        {{ end }}
    </div>

    <div class="bottom-nav">
        <a href="/pancreatitis-signs/feed" class="nav-item" style="text-decoration: none;">
            <i class="fa-solid fa-house"></i>
            <span>Лента</span>
        </a>
        <a href="/pancreatitis-signs/add" class="nav-item active" style="text-decoration: none;">
            <i class="fa-regular fa-square-plus"></i>
            <span>Добавить</span>
        </a>
        <a href="/pancreatitis-signs/grid" class="nav-item" style="text-decoration: none;">
            <i class="fa-solid fa-border-all"></i>
            <span>Плитка</span>
        </a>
    </div>

</div>

</body>
</html>
