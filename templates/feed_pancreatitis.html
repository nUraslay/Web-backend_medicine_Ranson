<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Оценка тяжести панкреатита по Рэнсону</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/pancreatitis_styles.css">
    <style>
        /* параметры признака под кнопкой «следующий»: порог и этап оценки */
        .feed-params {
            position: absolute;
            top: 100%;
            right: -8px;
            margin-top: 14px;
            width: 72px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-shadow: none;
        }

        .feed-param {
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
        }

        .feed-param-threshold {
            padding: 6px 4px;
            background-color: var(--white);
            color: var(--text-dark);
            font-size: 20px;
            font-weight: 700;
            line-height: 1.1;
        }

        .feed-param-stage {
            padding: 7px 4px;
            background-color: var(--white);
            color: var(--text-dark);
            font-size: 10px;
            font-weight: 700;
            line-height: 1.2;
        }
    </style>
</head>
<body>

<div class="mobile-container">

    {{ if .Error }}
    <div id="feed-page" class="page active">
        <div class="feed-overlay">
            <div class="feed-info">
                <div class="feed-title">{{ .Error }}</div>
            </div>
        </div>
    </div>
    {{ else }}
    <div id="feed-page" class="page active">
        <video class="feed-video-bg" src="{{ .Sign.VideoURL }}" autoplay muted loop playsinline
               onerror="this.onerror=null; this.src='/static/video/default_pancreatitis_sign.mp4';"></video>
        <div class="feed-overlay">
            <div class="feed-info">
                <div class="feed-title" id="feed-title-text">{{ .Sign.Title }}</div>
                <div class="feed-desc-container">
                    <span class="feed-desc-text" id="feed-desc">{{ .Sign.Description }}</span>
                    <button class="feed-more-btn">еще</button>
                </div>
            </div>

            <div class="feed-right-actions">
                <div class="action-btn like-btn">
                    <i class="fa-solid fa-heart"></i>
                    <span id="feed-likes">{{ .Sign.LikesCount }}</span>
                </div>
                <a href="/pancreatitis-signs/feed/{{ .Sign.ID }}?next=true" class="feed-next-btn" aria-label="Следующий признак">
                    <i class="fa-solid fa-arrow-right"></i>
                </a>

                <div class="feed-params">
                    <div class="feed-param feed-param-threshold">{{ .Sign.ThresholdText }}</div>
                    {{ if .Sign.Stage }}
                    <div class="feed-param feed-param-stage">{{ .Sign.Stage }}</div>
                    {{ end }}
                </div>
            </div>
        </div>
    </div>
    {{ end }}

    <div class="bottom-nav">
        <a href="/pancreatitis-signs/feed" class="nav-item active" style="text-decoration: none;">
            <i class="fa-solid fa-house"></i>
            <span>Лента</span>
        </a>
        <a href="/pancreatitis-signs/add" class="nav-item" style="text-decoration: none;">
            <i class="fa-regular fa-square-plus"></i>
            <span>Добавить</span>
        </a>
        <a href="/pancreatitis-signs/grid" class="nav-item" style="text-decoration: none;">
            <i class="fa-solid fa-border-all"></i>
            <span>Плитка</span>
        </a>
    </div>

</div>
</body>
</html>
