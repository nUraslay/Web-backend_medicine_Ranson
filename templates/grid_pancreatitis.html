<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Оценка тяжести панкреатита по Рэнсону</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/pancreatitis_styles.css">
    <style>
        .search-form { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .filter-row { display: flex; gap: 10px; width: 100%; }

        .filter-box {
            flex: 1; min-width: 0; min-height: 44px;
            display: flex; align-items: center; gap: 14px;
            padding: 0 15px;
            border: 1px solid #ccc; border-radius: 12px;
            background-color: var(--white);
        }
        .filter-value {
            min-width: 34px;
            font-size: 15px; font-weight: 700;
            color: var(--background-alternative);
        }
        .filter-slider {
            -webkit-appearance: none; appearance: none;
            --pct: 100%;
            flex: 1; min-width: 0; height: 6px; margin: 0;
            border-radius: 3px; outline: none; cursor: pointer;
            background: linear-gradient(to right,
                var(--background-alternative) 0%, var(--background-alternative) var(--pct),
                rgba(8, 195, 220, 0.2) var(--pct), rgba(8, 195, 220, 0.2) 100%);
        }
        .filter-slider::-webkit-slider-runnable-track { height: 6px; background: transparent; }
        .filter-slider::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 20px; height: 20px; margin-top: -7px; border-radius: 50%;
            background-color: var(--background-alternative);
            border: 2px solid var(--white);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
            cursor: pointer;
        }
        .filter-slider::-moz-range-track { height: 6px; background: transparent; }
        .filter-slider::-moz-range-thumb {
            width: 16px; height: 16px; border-radius: 50%;
            background-color: var(--background-alternative);
            border: 2px solid var(--white);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="mobile-container">

    <div id="grid-page" class="page active">
        <div class="grid-header">
            <h2 class="page-title">Все карточки</h2>
        </div>

        <form action="/pancreatitis-signs/grid" method="GET" class="search-form">
            <div class="filter-row">
                <div class="filter-box">
                    <span class="filter-value" id="filter-value">{{ .SliderValue }}</span>
                    <input type="range" name="max_value" id="filter-slider" class="filter-slider"
                           min="0" max="{{ .SliderMax }}" step="1" value="{{ .SliderValue }}">
                </div>
                <button type="submit" class="submit-btn search-btn" aria-label="Применить фильтр">
                    <i class="fa-solid fa-sliders"></i>
                </button>
            </div>
        </form>

        <div class="grid-container">
            {{ range .Signs }}
            <div class="card">
                <a href="/pancreatitis-signs/feed/{{ .ID }}" class="card-link" style="text-decoration: none; color: inherit;">
                    <img src="{{ .ImageURL }}" alt="{{ .Title }}" class="card-img"
                         onerror="this.onerror=null; this.src='/static/img/default_pancreatitis_sign.jpg';">
                    <div class="card-content">
                        <div class="card-title">{{ .Title }}</div>
                        <div class="card-tag">{{ .Stage }}</div>
                        <div class="card-footer">
                            <i class="fa-solid fa-heart"></i> {{ .LikesCount }}
                        </div>
                    </div>
                </a>
                <form action="/pancreatitis-signs/delete" method="POST" class="card-delete-form">
                    <input type="hidden" name="sign_id" value="{{ .ID }}">
                    <button type="submit" class="card-delete-btn" aria-label="Удалить">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </form>
            </div>
            {{ else }}
            <p class="grid-empty">Ничего не найдено</p>
            {{ end }}
        </div>
    </div>

    <div class="bottom-nav">
        <a href="/pancreatitis-signs/feed" class="nav-item" style="text-decoration: none;">
            <i class="fa-solid fa-house"></i>
            <span>Лента</span>
        </a>
        <a href="/pancreatitis-signs/add" class="nav-item" style="text-decoration: none;">
            <i class="fa-regular fa-square-plus"></i>
            <span>Добавить</span>
        </a>
        <a href="/pancreatitis-signs/grid" class="nav-item active" style="text-decoration: none;">
            <i class="fa-solid fa-border-all"></i>
            <span>Плитка</span>
        </a>
    </div>

</div>

<script>
    (function () {
        var slider = document.getElementById('filter-slider');
        var label = document.getElementById('filter-value');
        function update() {
            var pct = (slider.value - slider.min) / (slider.max - slider.min) * 100;
            slider.style.setProperty('--pct', pct + '%');
            label.textContent = slider.value;
        }
        slider.addEventListener('input', update);
        update();
    })();
</script>
</body>
</html>
